services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amanikah-api
    restart: unless-stopped
    env_file:
      - /root/amanikah-api/ops.env
    volumes:
      - /root/amanikah-api/server.py:/app/server.py:ro
      - /root/amanikah-api/private_features.py:/app/private_features.py:ro
      - /var/www/amanikah:/srv/amanikah:ro
      - api_data:/data
    command: ["python", "-u", "/app/server.py"]
    networks:
      edge:
        aliases:
          - amanikah-api

networks:
  edge:
    external: true
    name: airrates_edge

volumes:
  api_data:
