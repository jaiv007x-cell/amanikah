name: Amanikah Quality Gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio validator
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Run Python component and real HTTP integration tests
        run: python -m unittest discover -s api/tests -v
      - name: Check Python syntax
        run: python -m compileall -q api
      - name: Check website JavaScript syntax
        run: |
          node --check site/js/account-family-studio.js
          node --check site/js/interactive-film.js
          node --check site/js/simple-nikah.js
          node --check site/js/nikah-readiness.js
          node --check site/js/ops/console.js
          node --check site/js/community-interest.js
          bash -n scripts/backup-amanikah-offsite-restic.sh
      - name: Verify static release scripts and current design markers
        run: |
          bash -n scripts/deploy-site-from-vps-github.sh
          bash -n scripts/check-amanikah-live.sh
          grep -q 'A simple, respectful start' site/index.html
          grep -q 'story-outside-disclosure' site/index.html
          grep -q 'button-updates' site/index.html
          test -s site/css/finish-2026.css
          test -s site/icon.svg
          grep -q 'id="waliForm"' site/account/family.html
          grep -q 'id="scopeWali"' site/account/family.html
          grep -q '/me/family/brief' site/js/account-family-studio.js
      - name: Validate rendered 42-second silent film
        run: |
          test -s site/images/film/amanikah-story-42s.mp4
          python3 - <<'PY'
          import json,subprocess
          p='site/images/film/amanikah-story-42s.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',p]))
          assert 41.8<=float(d['format']['duration'])<=42.2
          assert [s['codec_type'] for s in d['streams']]==['video']
          assert d['streams'][0]['r_frame_rate']=='24/1'
          PY
      - name: Verify no exposed AI credentials in tracked env template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("api/ops.env.example").read_text()
          assert "OPENAI_API_KEY=" in p
          assert "AMANIKAH_AI_ENABLED=0" in p
          assert "MATCHMAKING_LIVE=0" in p
          PY
