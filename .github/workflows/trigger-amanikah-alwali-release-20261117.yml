name: One-time protected Al Wali release request (2026-11-17)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-amanikah-alwali-release-20261117.yml'
permissions:
  actions: write
  contents: read
jobs:
  request:
    if: github.ref == 'refs/heads/main' && github.repository == 'jaiv007x-cell/amanikah'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing protected VPS workflow with early-access email skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-vps-release.yml/dispatches" \
            --data '{"ref":"main","inputs":{"confirmation":"DEPLOY","allow_mail_skip":true}}'
          echo "Protected Al Wali release requested, without bypassing quality, SSH, backup or private API checks."
