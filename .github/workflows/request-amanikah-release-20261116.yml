name: Request Amanikah protected VPS release (one-time, 2026-11-16)
# One-time GitHub-mediated release request. The target manual workflow retains
# all quality, SSH credential, transactional email and production environment gates.
# This file does NOT perform SSH, access VPS secrets, or deploy directly.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/request-amanikah-release-20261116.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch-protected-release:
    if: github.ref == 'refs/heads/main' && github.repository == 'jaiv007x-cell/amanikah'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the existing manual protected release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "Requesting protected manual-vps-release.yml for main; deployment remains gated."
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-vps-release.yml/dispatches" \
            --data '{"ref":"main","inputs":{"confirmation":"DEPLOY"}}'
          echo "Protected release request sent; check the target workflow and its production gate."
