name: Amanikah real-browser smoke tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: amanikah-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start isolated static web server
        run: |
          python -m http.server 8765 --directory site > /tmp/site.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8765/ > /dev/null
      - name: Run actual Chromium interaction checks
        run: npx playwright test site/tests/ui-smoke.spec.cjs --reporter=line
      - name: Capture screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amanikah-ui-screenshots
          path: test-results
          if-no-files-found: ignore
