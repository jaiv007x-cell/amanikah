name: Build and commit 30-second illustrative film
on:
  push:
    branches: ['feature/readable-home-family-guide-2026-11']
    paths:
      - 'scripts/build-amanikah-film.sh'
      - '.github/workflows/build-film.yml'
permissions:
  contents: write
jobs:
  film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Build film from existing fictional actors
        run: bash scripts/build-amanikah-film.sh
      - name: Validate exactly 30 seconds
        run: |
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 site/images/film/amanikah-story-30s.mp4)
          python3 -c "import sys; assert 29.8 <= float(sys.argv[1]) <= 30.2" "$duration"
      - name: Commit generated asset to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/film/amanikah-story-30s.mp4
          if ! git diff --cached --quiet; then
            git commit -m "assets: add generated 30-second Amanikah film"
            git push origin HEAD:feature/readable-home-family-guide-2026-11
          fi
