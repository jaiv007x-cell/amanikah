name: One-time Amanikah security and community pilot release request
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-amanikah-hardening-release-20261117.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && github.repository == 'jaiv007x-cell/amanikah'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing protected production workflow in early-access mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-vps-release.yml/dispatches" \
            --data '{"ref":"main","inputs":{"confirmation":"DEPLOY","allow_mail_skip":true}}'
          echo "Requested protected early-access release: quality, pinned SSH host, backups and private API checks remain required."
