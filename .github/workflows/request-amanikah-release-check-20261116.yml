name: Verify and request gated Amanikah release (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/request-amanikah-release-check-20261116.yml'
permissions:
  actions: write
  contents: read
jobs:
  request:
    if: github.repository == 'jaiv007x-cell/amanikah' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing protected release, no gate bypass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-vps-release.yml/dispatches" \
            -d '{"ref":"main","inputs":{"confirmation":"DEPLOY"}}'
          echo "Gated VPS release requested. Production approval and credentials still required."
