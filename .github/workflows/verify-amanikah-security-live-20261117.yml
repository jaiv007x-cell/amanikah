name: One-time Amanikah launch-security production verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-amanikah-security-live-20261117.yml'
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Live checks for hardening without creating real user records
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="https://amanikah.com"
          curl -fsS --max-time 20 -D /tmp/health-headers.txt "$BASE/api/amanikah/health" > /tmp/health.json
          python3 - <<'PY'
          import json
          health=json.load(open('/tmp/health.json'))
          assert health.get('ok') is True,health
          assert health.get('waitlistMode') is True,health
          assert health.get('matchmakingLive') is False,health
          assert health.get('mailConfigured') is False,health
          print('PASS live API healthy, no matching, no enrollment email')
          PY
          grep -Eqi '^x-content-type-options: nosniff' /tmp/health-headers.txt
          grep -Eqi '^cache-control: no-store' /tmp/health-headers.txt
          grep -Eqi '^referrer-policy: (no-referrer|strict-origin-when-cross-origin)' /tmp/health-headers.txt
          grep -Eqi '^x-frame-options: (DENY|SAMEORIGIN)' /tmp/health-headers.txt
          echo 'PASS public reverse proxy emits no-store, nosniff, and safe baseline framing/referrer policies'
          for path in /api/amanikah/me/introductions /api/amanikah/me/family/brief /api/amanikah/me/voice /api/amanikah/ops/dashboard; do
            status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$BASE$path")
            [[ "$status" == 401 ]] || { echo "UNEXPECTED_PRIVATE_RESPONSE $path $status"; exit 1; }
          done
          echo 'PASS anonymous access denied to introductions, family, voice, and ops'
          verify_code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$BASE/api/amanikah/auth/verify?token=public-ci-invalid")
          [[ "$verify_code" == 404 ]] || { echo "VERIFY_GET_NOT_DISABLED=$verify_code"; exit 1; }
          echo 'PASS email verification is POST-only'
          register_code=$(curl -sS --max-time 15 -o /tmp/register-result.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' "$BASE/api/amanikah/auth/register" \
            -d '{"email":"ci-never-created@example.test","password":"synthetic-password-long","age":29,"displayName":"Synthetic","consentTerms":true,"consentPrivacy":true}')
          [[ "$register_code" == 503 ]] || { echo "REGISTRATION_GATE_FAILED=$register_code"; exit 1; }
          python3 - <<'PY'
          import json
          value=json.load(open('/tmp/register-result.json'))
          assert value['code']=='REGISTRATION_PAUSED',value
          print('PASS server denies new unverified registrations with mail disabled')
          PY
          code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$BASE/api/amanikah/auth/logout" \
            -X POST -H 'Content-Type: application/json' -d '{}')
          [[ "$code" == 200 ]] || { echo "LOGOUT_NOT_AVAILABLE=$code"; exit 1; }
          echo 'PASS idempotent logout endpoint exists'
          curl -fsS --max-time 15 "$BASE/account/" | grep -q 'id="memberIntroductions"'
          curl -fsS --max-time 15 "$BASE/ops/" | grep -q 'Create private draft'
          curl -fsS --max-time 15 "$BASE/api/amanikah/al-wali/status" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") and x.get("guidedAvailable")'
          echo 'PASS member and operator consent UI plus Al Wali'
  protected-vps:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    env:
      AMANIKAH_VPS_HOST: ${{ secrets.AMANIKAH_VPS_HOST }}
      AMANIKAH_VPS_USER: ${{ secrets.AMANIKAH_VPS_USER }}
      AMANIKAH_VPS_KEY: ${{ secrets.AMANIKAH_VPS_KEY }}
      AMANIKAH_SSH_KNOWN_HOSTS: ${{ secrets.AMANIKAH_SSH_KNOWN_HOSTS }}
    steps:
      - name: Read-only check of live matching gates, proxy CIDR and additive migration
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AMANIKAH_VPS_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$AMANIKAH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy "$AMANIKAH_VPS_USER@$AMANIKAH_VPS_HOST" \
            'if [ "$(id -u)" -eq 0 ]; then DOCKER=docker; else DOCKER="sudo -n docker"; fi; \
            $DOCKER exec amanikah-api python -c '"'"'from server import Store,Handler; import os,sqlite3; c=os.environ; db=sqlite3.connect(c.get("AMANIKAH_DB","/data/amanikah.sqlite")); cols=[r[1] for r in db.execute("PRAGMA table_info(introduction_cases)")]; assert "peer_member_id" in cols; assert db.execute("SELECT name FROM sqlite_master WHERE type=\x27table\x27 AND name=\x27introduction_consents\x27").fetchone(); assert c.get("MATCHMAKING_LIVE","0")!="1"; assert c.get("AMANIKAH_TRUSTED_PROXY_CIDRS")=="172.19.0.2/32"; assert len(c.get("SESSION_PEPPER",""))>=32; assert len(c.get("OPS_ADMIN_TOKEN",""))>=20; print("PASS matching schema migrated, matching disabled, proxy verified and auth credentials stable")'"'"''
