<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Create production account — Amanikah</title>
<link rel="stylesheet" href="/css/site.css?v=5">
</head>
<body class="no-dock">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="bar">
    <a class="logo" href="/" aria-label="Amanikah">Amani<span>kah</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="/account/register.html" aria-current="page">Register</a>
      <a href="/account/login.html">Sign in</a>
    </nav>
  </div>
</header>
<main id="main" class="wrap narrow" style="padding:32px 16px 64px">
  <p class="kicker">Production membership</p>
  <h1>Create an account</h1>
  <p>Email verification is required before private routes work. Demo registration at <a href="/register">/register</a> is not a production account.</p>
  <div class="panel">
    <form id="register" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
      <div class="field"><label for="password">Password (min 10)</label><input id="password" name="password" type="password" minlength="10" required></div>
      <div class="field"><label for="displayName">Display name</label><input id="displayName" name="displayName" required></div>
      <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="21" max="80" required></div>
      <div class="field"><label for="city">City</label><input id="city" name="city"></div>
      <div class="check"><input id="consentTerms" name="consentTerms" type="checkbox" value="yes" required><label for="consentTerms">I agree to the <a href="/terms.html">Terms</a>.</label></div>
      <div class="check"><input id="consentPrivacy" name="consentPrivacy" type="checkbox" value="yes" required><label for="consentPrivacy">I agree to the <a href="/privacy.html">Privacy</a> notice.</label></div>
      <button class="btn btn-emerald" type="submit">Create account</button>
      <p class="status form-status" role="status"></p>
    </form>
  </div>
</main>
<script src="/js/platform.js"></script>
<script>
document.getElementById("register").addEventListener("submit", function (e) {
  e.preventDefault();
  var form = e.target;
  var status = form.querySelector(".form-status");
  var body = Object.fromEntries(new FormData(form).entries());
  body.age = Number(body.age);
  body.consentTerms = !!body.consentTerms;
  body.consentPrivacy = !!body.consentPrivacy;
  status.textContent = "Submitting…";
  AmanikahPlatform.post("/auth/register", body).then(function (r) {
    if (!r.body.ok) {
      status.textContent = r.body.message || r.body.code || "Registration failed";
      return;
    }
    status.textContent = r.body.message + " Check operator outbox if mail is not configured yet.";
  }).catch(function () {
    status.textContent = "Network error.";
  });
});
</script>
</body>
</html>
