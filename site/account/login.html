<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Amanikah</title>
<link rel="stylesheet" href="/css/site.css?v=5">
</head>
<body class="no-dock">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="bar">
    <a class="logo" href="/" aria-label="Amanikah">Amani<span>kah</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="/account/register.html">Register</a>
      <a href="/account/login.html" aria-current="page">Sign in</a>
    </nav>
  </div>
</header>
<main id="main" class="wrap narrow" style="padding:32px 16px 64px">
  <p class="kicker">Production membership</p>
  <h1>Sign in</h1>
  <p>Production login only. Demo accounts stay on <a href="/login">/login</a>.</p>
  <div class="panel">
    <form id="login" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required></div>
      <button class="btn btn-emerald" type="submit">Sign in</button>
      <p class="status form-status" role="status"></p>
    </form>
  </div>
</main>
<script src="/js/platform.js"></script>
<script>
document.getElementById("login").addEventListener("submit", function (e) {
  e.preventDefault();
  var form = e.target;
  var status = form.querySelector(".form-status");
  var body = Object.fromEntries(new FormData(form).entries());
  status.textContent = "Signing in…";
  AmanikahPlatform.post("/auth/login", body).then(function (r) {
    if (!r.body.ok) {
      status.textContent = r.body.message || r.body.code || "Sign-in failed";
      return;
    }
    try { sessionStorage.setItem("amanikah.session", r.body.token); } catch (err) {}
    window.location.href = "/account/";
  }).catch(function () {
    status.textContent = "Network error.";
  });
});
</script>
</body>
</html>
